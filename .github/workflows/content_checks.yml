name: Content checks

# Guards the public site against overclaiming and broken links. Separate from deployment:
# GitHub Pages ("pages build and deployment") still builds and publishes main on its own.
on:
  push:
    branches-ignore:
      - gh-pages
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PyYAML
        run: python -m pip install --quiet pyyaml

      - name: Claims check (statuses, "PhD candidate", award words)
        run: python scripts/check_claims.py --github

      - name: Set up Ruby
        if: success() || failure()
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.1
          bundler-cache: true

      - name: Build site
        if: success() || failure()
        run: bundle exec jekyll build

      - name: Internal links, assets, anchors and YAML
        if: success() || failure()
        run: python scripts/check_site.py _site --src .
