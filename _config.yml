title: Kulbir Singh Ahluwalia
name: Kulbir Singh Ahluwalia
position: PhD Candidate
email: ksa5@illinois.edu
# Plain-text summary: jekyll-feed prints it as the Atom <subtitle>, so no Markdown here.
description: >-
  Ph.D. candidate in Computer Science at UIUC working on language-grounded navigation for agricultural and outdoor robots and edge AI.
# Markdown bio rendered in the About section of index.html ({{ site.bio | markdownify }}).
bio: >-
  I'm Kulbir Singh Ahluwalia, a Ph.D. candidate in Computer Science at the University of Illinois Urbana-Champaign ([UIUC](https://illinois.edu/)),
  advised by [Prof. Girish Chowdhary](http://daslab.illinois.edu) and [Prof. Julia Hockenmaier](https://hmr-lab.github.io).
  My research is on language-grounded waypoint generation and navigation for agricultural and outdoor robots (WaypointGen),
  and on running these models efficiently on edge AI hardware.
  From June to August 2026 I was a Compute Chipset Product Management Intern at Qualcomm in San Diego, and in Summer 2025 I was an AI Intern at EarthSense, Inc.,
  where I contributed to a natural language-conditioned waypoint generation pipeline for outdoor robots.
  In Fall 2026 I am a Teaching Assistant for [CS 440/ECE 448: Artificial Intelligence](https://courses.grainger.illinois.edu/cs440/fa2026/) with Prof. Margaret Fleck,
  and in Fall 2025 I co-developed the [CS 498 GC Mobile Robotics course](/cs498gc/fa25/) with Prof. Chowdhary.
  Before UIUC, I earned a Master of Engineering in Robotics from the University of Maryland, College Park.
  My long-term goal is scaling up Physical AI for advancing humanity.





