- date: "May 2026"
  content: "Upcoming <strong>Compute Chipset Product Management Intern</strong> at <strong>Qualcomm</strong>. I will be in San Diego, California this summer!"

- date: "Apr 2026"
  content: 'Our poster <strong>WaypointGen: Natural Language to 2D Navigation Waypoints Generation using VLMs</strong> was accepted at the <strong>CSL Student Conference (CSL SC 2026)</strong> at UIUC. <a href="files/publications/CSL_SC_WaypointGen_Accepted_Poster.pdf">[poster PDF]</a>'

- date: "Mar 2026"
  content: "Began preparing <strong>WaypointGen++</strong> for submission to <strong>IEEE Robotics and Automation Letters (RA-L)</strong>, extending our VLM-based waypoint generation pipeline to outdoor mobile manipulators."

- date: "Oct 2025"
  content: 'Released <strong><a href="https://kulbir-singh-ahluwalia.com/cs498gc/fa25/slaming_mars.html">SLAM-ing Mars</a></strong>, a two-part Mobile Manipulator Exploration &amp; SLAM challenge for CS498GC Fall 2025: students operated a Husky + UR3 + Robotiq gripper in a Mars Gazebo world. <strong>Part 1</strong> (25 pts) covered robot setup and navigation; <strong>Part 2</strong> (75 pts) extended to full SLAM with an optional Mars dust-storm bonus.'

- date: "May 2025"
  content: 'Our paper <strong>Active Semantic Mapping with Mobile Manipulator in Horticultural Environments</strong> was presented at <a href="https://2025.ieee-icra.org/"><strong>ICRA 2025</strong></a>. <a href="https://arxiv.org/abs/2412.10515">arXiv:2412.10515</a> &middot; <a href="https://kendallkoe.com/Active_Semantic_Mapping/">project page</a>'

- date: "May 2025"
  content: "Joined <strong>Earthsense Inc.</strong> as an <strong>AI Intern</strong> for Summer 2025 in Urbana, IL, deploying VLMs (Molmo-7B, Gemma-3-27B, Qwen-2.5-VL-72B, Llama4-Scout, SpatialVLM) for natural-language-conditioned navigation on outdoor agricultural robots."

- date: "Fall 2023"
  content: 'Presented the poster <strong>Plant Placement using Natural Language Grounding</strong> at the <strong>AIFARMS Annual Conference</strong>. <a href="https://github.com/kulbir-ahluwalia/kulbir-ahluwalia.github.io/blob/main/files/V3_AIFARMS-KSA_Poster-2023.pdf">[poster PDF]</a>'

- date: "Aug 2022"
  content: 'Started my <strong>Ph.D. in Computer Science at UIUC</strong>, advised by <a href="http://daslab.illinois.edu">Prof. Girish Chowdhary</a> (DASLAB) and <a href="https://hmr-lab.github.io">Prof. Julia Hockenmaier</a> (HMR Lab).'
