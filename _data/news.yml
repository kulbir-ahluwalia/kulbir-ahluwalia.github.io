- date: "Jun 2026"
  content: 'Started writing our journal paper <strong>TaP: Trajectory as Policies for Spatial Reasoning using Hierarchical Abstractions &amp; Grounded Constraint Phrases for Mobile Manipulator Navigation</strong> for the <strong>IEEE Transactions on Robotics (T-RO)</strong> (manuscript in preparation).'

- date: "May 2026"
