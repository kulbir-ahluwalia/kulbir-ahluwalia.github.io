- date: "Oct 2026"
  content: 'Posted TA reference runs for the CS498GC <a href="/cs498gc/fa25/slaming_mars.html#ta-demos"><strong>SLAM-ing Mars</strong></a> assignment: a Husky + UR3 driving through the Mars Gazebo world and the SLAM Toolbox occupancy map it builds.'

- date: "Oct 2026"
  content: 'Submitted our workshop paper <strong>WaypointGen: Compositional Trajectory Generation by Grounding Hierarchical Language Abstractions and Constraint Phrases for Outdoor Navigation</strong> to the <a href="https://compogen-robotics.github.io/corl2026/">CoRL 2026 Workshop on Compositional Generalization for Real-World Robot Learning</a> (non-archival; under review).'

- date: "Aug 2026"
