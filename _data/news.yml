- date: "Mar 2026"
  content: "Began <strong>WaypointGen++</strong>, the extended journal version of WaypointGen for outdoor mobile manipulators (now our T-RO manuscript <strong>TaP</strong>)."

- date: "Feb 2026"
  content: 'Our poster <strong>WaypointGen: Learning Grounded Waypoint based Navigation for Mobile Manipulators</strong> was accepted at the <strong>CSL Student Conference (CSL SC 2026)</strong> at UIUC. <a href="files/publications/CSL_SC_WaypointGen_Accepted_Poster.pdf">[poster PDF]</a>'

- date: "Oct 2025"
  content: 'Released <strong><a href="/cs498gc/fa25/slaming_mars.html">SLAM-ing Mars</a></strong>, a two-part Mobile Manipulator Exploration &amp; SLAM assignment for CS498GC Fall 2025 in which students operated a Husky + UR3 + Robotis gripper in a Mars Gazebo world. <strong>Part 1</strong> (25 pts) covered robot setup and navigation; <strong>Part 2</strong> (75 pts as announced, made optional extra credit on Dec 7, 2025) covered SLAM on Mars, with an optional Mars dust-storm bonus.'

- date: "May 2025"
  content: 'Our paper <strong>Active Semantic Mapping with Mobile Manipulator in Horticultural Environments</strong> was presented at <a href="https://2025.ieee-icra.org/"><strong>ICRA 2025</strong></a>. <a href="https://doi.org/10.1109/ICRA55743.2025.11127547">IEEE</a> &middot; <a href="https://arxiv.org/abs/2412.10515">arXiv:2412.10515</a> &middot; <a href="https://kendallkoe.com/Active_Semantic_Mapping/">project page</a>'

- date: "May 2025"
  content: "Joined <strong>Earthsense Inc.</strong> as an <strong>AI Intern</strong> for Summer 2025 in Urbana, IL, deploying VLMs (Molmo-7B-D, Gemma-3-27B, Qwen-2.5-VL-72B, Qwen3-30B-A3B, Llama4-Scout, Spatial-VLM) for natural-language-conditioned navigation on outdoor agricultural robots."

- date: "Fall 2023"
