function b64(s){const b=atob(s),a=new Uint8Array(b.length);for(let i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
async function unlock(){
  const err=document.getElementById('err');err.textContent='';
  try{
    const raw=b64(CT_B64);
    if(String.fromCharCode(...raw.slice(0,8))!=='Salted__')throw 0;
    const salt=raw.slice(8,16),ct=raw.slice(16);
    const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('pw').value),'PBKDF2',false,['deriveBits']);
    const dk=new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},km,384));
    const key=await crypto.subtle.importKey('raw',dk.slice(0,32),{name:'AES-CBC'},false,['decrypt']);
    const pt=await crypto.subtle.decrypt({name:'AES-CBC',iv:dk.slice(32,48)},key,ct);
    document.open();document.write(new TextDecoder().decode(pt));document.close();
  }catch(e){err.textContent='Incorrect password.';}
}
document.getElementById('go').onclick=unlock;
document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')unlock();});
