<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" rx="20" fill="#8E44AD"/>
  <text x="160" y="120" text-anchor="middle" dominant-baseline="central" fill="white" font-family="Arial, sans-serif" font-size="62" font-weight="bold">ARIAC</text>
  <!-- Factory/assembly conveyor -->
  <rect x="70" y="175" width="180" height="12" rx="4" fill="rgba(255,255,255,0.4)"/>
  <!-- Objects on conveyor -->
  <rect x="90" y="160" width="25" height="18" rx="3" fill="none" stroke="white" stroke-width="2.5"/>
  <rect x="140" y="157" width="30" height="21" rx="3" fill="none" stroke="white" stroke-width="2.5"/>
  <rect x="200" y="160" width="25" height="18" rx="3" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Conveyor rollers -->
  <circle cx="90" cy="195" r="6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="160" cy="195" r="6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <circle cx="230" cy="195" r="6" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <text x="160" y="235" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="22">Assembly</text>
  <text x="160" y="285" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="16">ARIAC 2019</text>
</svg>
