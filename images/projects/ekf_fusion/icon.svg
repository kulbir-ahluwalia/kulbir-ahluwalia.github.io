<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" rx="20" fill="#8E44AD"/>
  <text x="160" y="125" text-anchor="middle" dominant-baseline="central" fill="white" font-family="Arial, sans-serif" font-size="82" font-weight="bold">EKF</text>
  <!-- Sensor fusion diagram: two inputs merging -->
  <circle cx="100" cy="200" r="14" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
  <circle cx="220" cy="200" r="14" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
