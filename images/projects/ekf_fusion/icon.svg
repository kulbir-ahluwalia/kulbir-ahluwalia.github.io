  <line x1="206" y1="200" x2="175" y2="220" stroke="rgba(255,255,255,0.7)" stroke-width="2.5"/>
  <circle cx="160" cy="228" r="16" fill="white" fill-opacity="0.2" stroke="white" stroke-width="2.5"/>
  <text x="160" y="228" text-anchor="middle" dominant-baseline="central" fill="white" font-family="Arial, sans-serif" font-size="12" font-weight="bold">FUSE</text>
  <text x="160" y="285" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="16">Sensor Fusion</text>
