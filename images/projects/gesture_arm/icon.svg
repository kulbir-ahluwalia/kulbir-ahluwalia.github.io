<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" rx="20" fill="#8E44AD"/>
  <!-- Hand icon -->
  <!-- Palm -->
  <rect x="110" y="130" width="60" height="70" rx="12" fill="none" stroke="white" stroke-width="3"/>
  <!-- Fingers -->
  <rect x="115" y="85" width="12" height="50" rx="6" fill="none" stroke="white" stroke-width="2.5"/>
  <rect x="131" y="75" width="12" height="60" rx="6" fill="none" stroke="white" stroke-width="2.5"/>
  <rect x="147" y="80" width="12" height="55" rx="6" fill="none" stroke="white" stroke-width="2.5"/>
  <rect x="163" y="90" width="11" height="45" rx="5.5" fill="none" stroke="white" stroke-width="2.5"/>
  <!-- Thumb -->
  <rect x="94" y="135" width="11" height="32" rx="5.5" fill="none" stroke="white" stroke-width="2.5" transform="rotate(-25, 99, 151)"/>
  <!-- Signal waves from hand -->
  <path d="M 190 140 Q 200 120 195 100" fill="none" stroke="rgba(255,255,255,0.5)" stroke-width="2"/>
  <path d="M 200 145 Q 215 120 208 95" fill="none" stroke="rgba(255,255,255,0.4)" stroke-width="2"/>
  <path d="M 210 150 Q 230 120 222 90" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="2"/>
  <!-- Arrow to robot arm -->
  <line x1="195" y1="175" x2="240" y2="175" stroke="white" stroke-width="2.5"/>
  <polygon points="234,168 250,175 234,182" fill="white"/>
  <!-- Small robot arm -->
  <line x1="250" y1="200" x2="250" y2="165" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <line x1="250" y1="165" x2="270" y2="145" stroke="white" stroke-width="3" stroke-linecap="round"/>
  <circle cx="250" cy="200" r="6" fill="white"/>
  <text x="160" y="245" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Arial, sans-serif" font-size="22" font-weight="bold">Gesture</text>
  <text x="160" y="285" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="16">Controlled Arm</text>
</svg>
