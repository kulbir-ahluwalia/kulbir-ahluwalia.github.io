<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" rx="20" fill="#E67E22"/>
  <text x="160" y="115" text-anchor="middle" dominant-baseline="central" fill="white" font-family="Arial, sans-serif" font-size="90" font-weight="bold">LK</text>
  <!-- Tracking bounding box -->
  <rect x="100" y="165" width="120" height="80" rx="4" fill="none" stroke="white" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Corner markers -->
  <line x1="96" y1="170" x2="96" y2="185" stroke="white" stroke-width="4"/>
  <line x1="96" y1="170" x2="111" y2="170" stroke="white" stroke-width="4"/>
  <line x1="224" y1="170" x2="224" y2="185" stroke="white" stroke-width="4"/>
  <line x1="224" y1="170" x2="209" y2="170" stroke="white" stroke-width="4"/>
  <line x1="96" y1="240" x2="96" y2="225" stroke="white" stroke-width="4"/>
  <line x1="96" y1="240" x2="111" y2="240" stroke="white" stroke-width="4"/>
  <line x1="224" y1="240" x2="224" y2="225" stroke="white" stroke-width="4"/>
  <line x1="224" y1="240" x2="209" y2="240" stroke="white" stroke-width="4"/>
  <!-- Center crosshair -->
  <line x1="155" y1="205" x2="165" y2="205" stroke="white" stroke-width="2"/>
  <line x1="160" y1="200" x2="160" y2="210" stroke="white" stroke-width="2"/>
  <text x="160" y="285" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="16">Lucas-Kanade Tracker</text>
</svg>
