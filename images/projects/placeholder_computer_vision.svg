<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="8" fill="#1a202c"/>
  <rect x="20" y="20" width="360" height="260" rx="6" fill="#2d3748" opacity="0.5"/>
  <!-- Camera/Eye icon -->
  <ellipse cx="200" cy="130" rx="70" ry="55" fill="#4c51bf" opacity="0.3" stroke="#667eea" stroke-width="2"/>
  <ellipse cx="200" cy="130" rx="50" ry="40" fill="#4c51bf" opacity="0.5" stroke="#667eea" stroke-width="2"/>
  <circle cx="200" cy="130" r="25" fill="#667eea"/>
  <circle cx="200" cy="130" r="12" fill="#1a202c"/>
  <circle cx="200" cy="130" r="5" fill="#a3bffa"/>
  <!-- Scan lines -->
  <line x1="100" y1="80" x2="140" y2="100" stroke="#667eea" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="80" x2="260" y2="100" stroke="#667eea" stroke-width="1" opacity="0.4"/>
  <line x1="100" y1="180" x2="140" y2="165" stroke="#667eea" stroke-width="1" opacity="0.4"/>
  <line x1="300" y1="180" x2="260" y2="165" stroke="#667eea" stroke-width="1" opacity="0.4"/>
  <!-- Corner brackets -->
  <path d="M110,90 L110,75 L125,75" fill="none" stroke="#a3bffa" stroke-width="2"/>
  <path d="M290,90 L290,75 L275,75" fill="none" stroke="#a3bffa" stroke-width="2"/>
  <path d="M110,170 L110,185 L125,185" fill="none" stroke="#a3bffa" stroke-width="2"/>
  <path d="M290,170 L290,185 L275,185" fill="none" stroke="#a3bffa" stroke-width="2"/>
  <!-- Label -->
  <text x="200" y="245" text-anchor="middle" fill="#a0aec0" font-family="sans-serif" font-size="16" font-weight="600">Computer Vision</text>
</svg>