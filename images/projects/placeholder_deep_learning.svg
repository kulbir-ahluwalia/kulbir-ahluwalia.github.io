<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="8" fill="#1a202c"/>
  <rect x="20" y="20" width="360" height="260" rx="6" fill="#322659" opacity="0.5"/>
  <!-- Neural network nodes - layer 1 -->
  <circle cx="100" cy="80" r="12" fill="#9f7aea" opacity="0.8"/>
  <circle cx="100" cy="130" r="12" fill="#9f7aea" opacity="0.8"/>
  <circle cx="100" cy="180" r="12" fill="#9f7aea" opacity="0.8"/>
  <!-- Layer 2 -->
  <circle cx="200" cy="65" r="12" fill="#b794f4"/>
  <circle cx="200" cy="115" r="12" fill="#b794f4"/>
  <circle cx="200" cy="165" r="12" fill="#b794f4"/>
  <circle cx="200" cy="215" r="12" fill="#b794f4"/>
  <!-- Layer 3 -->
  <circle cx="300" cy="110" r="12" fill="#d6bcfa"/>
  <circle cx="300" cy="160" r="12" fill="#d6bcfa"/>
  <!-- Connections layer 1 to 2 -->
  <line x1="112" y1="80" x2="188" y2="65" stroke="#9f7aea" stroke-width="1" opacity="0.4"/>
  <line x1="112" y1="80" x2="188" y2="115" stroke="#9f7aea" stroke-width="1" opacity="0.4"/>
  <line x1="112" y1="80" x2="188" y2="165" stroke="#9f7aea" stroke-width="1" opacity="0.3"/>
  <line x1="112" y1="80" x2="188" y2="215" stroke="#9f7aea" stroke-width="1" opacity="0.2"/>
  <line x1="112" y1="130" x2="188" y2="65" stroke="#9f7aea" stroke-width="1" opacity="0.3"/>
  <line x1="112" y1="130" x2="188" y2="115" stroke="#9f7aea" stroke-width="1" opacity="0.5"/>
  <line x1="112" y1="130" x2="188" y2="165" stroke="#9f7aea" stroke-width="1" opacity="0.4"/>
  <line x1="112" y1="130" x2="188" y2="215" stroke="#9f7aea" stroke-width="1" opacity="0.3"/>
  <line x1="112" y1="180" x2="188" y2="65" stroke="#9f7aea" stroke-width="1" opacity="0.2"/>
  <line x1="112" y1="180" x2="188" y2="115" stroke="#9f7aea" stroke-width="1" opacity="0.3"/>
  <line x1="112" y1="180" x2="188" y2="165" stroke="#9f7aea" stroke-width="1" opacity="0.5"/>
  <line x1="112" y1="180" x2="188" y2="215" stroke="#9f7aea" stroke-width="1" opacity="0.4"/>
  <!-- Connections layer 2 to 3 -->
  <line x1="212" y1="65" x2="288" y2="110" stroke="#b794f4" stroke-width="1" opacity="0.4"/>
  <line x1="212" y1="65" x2="288" y2="160" stroke="#b794f4" stroke-width="1" opacity="0.3"/>
  <line x1="212" y1="115" x2="288" y2="110" stroke="#b794f4" stroke-width="1" opacity="0.5"/>
  <line x1="212" y1="115" x2="288" y2="160" stroke="#b794f4" stroke-width="1" opacity="0.4"/>
  <line x1="212" y1="165" x2="288" y2="110" stroke="#b794f4" stroke-width="1" opacity="0.4"/>
  <line x1="212" y1="165" x2="288" y2="160" stroke="#b794f4" stroke-width="1" opacity="0.5"/>
  <line x1="212" y1="215" x2="288" y2="110" stroke="#b794f4" stroke-width="1" opacity="0.3"/>
  <line x1="212" y1="215" x2="288" y2="160" stroke="#b794f4" stroke-width="1" opacity="0.4"/>
  <!-- Label -->
  <text x="200" y="265" text-anchor="middle" fill="#a0aec0" font-family="sans-serif" font-size="16" font-weight="600">Deep Learning</text>
