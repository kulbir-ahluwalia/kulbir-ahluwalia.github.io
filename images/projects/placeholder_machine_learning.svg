<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="8" fill="#1a202c"/>
  <rect x="20" y="20" width="360" height="260" rx="6" fill="#3c1f1f" opacity="0.4"/>
  <!-- Axes -->
  <line x1="80" y1="220" x2="340" y2="220" stroke="#a0aec0" stroke-width="2"/>
  <line x1="80" y1="220" x2="80" y2="50" stroke="#a0aec0" stroke-width="2"/>
  <!-- Data points cluster 1 -->
  <circle cx="120" cy="180" r="5" fill="#fc8181" opacity="0.7"/>
  <circle cx="140" cy="170" r="5" fill="#fc8181" opacity="0.7"/>
  <circle cx="130" cy="190" r="5" fill="#fc8181" opacity="0.7"/>
  <circle cx="150" cy="175" r="5" fill="#fc8181" opacity="0.7"/>
  <circle cx="135" cy="165" r="5" fill="#fc8181" opacity="0.7"/>
  <!-- Data points cluster 2 -->
  <circle cx="240" cy="100" r="5" fill="#63b3ed" opacity="0.7"/>
  <circle cx="260" cy="90" r="5" fill="#63b3ed" opacity="0.7"/>
  <circle cx="250" cy="110" r="5" fill="#63b3ed" opacity="0.7"/>
  <circle cx="270" cy="95" r="5" fill="#63b3ed" opacity="0.7"/>
  <circle cx="255" cy="80" r="5" fill="#63b3ed" opacity="0.7"/>
  <!-- Decision boundary -->
  <line x1="100" y1="200" x2="310" y2="60" stroke="#f6e05e" stroke-width="2" stroke-dasharray="6,3" opacity="0.7"/>
  <!-- Margin lines -->
  <line x1="90" y1="185" x2="300" y2="45" stroke="#f6e05e" stroke-width="1" opacity="0.3"/>
  <line x1="110" y1="215" x2="320" y2="75" stroke="#f6e05e" stroke-width="1" opacity="0.3"/>
  <!-- Label -->
  <text x="200" y="260" text-anchor="middle" fill="#a0aec0" font-family="sans-serif" font-size="16" font-weight="600">Machine Learning</text>
</svg>