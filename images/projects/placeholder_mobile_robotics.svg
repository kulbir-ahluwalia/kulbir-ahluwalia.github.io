<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="8" fill="#1a365d"/>
  <rect x="20" y="20" width="360" height="260" rx="6" fill="#2a4a7f" opacity="0.5"/>
  <!-- Robot body -->
  <rect x="155" y="90" width="90" height="100" rx="10" fill="#63b3ed" opacity="0.9"/>
  <!-- Robot head -->
  <rect x="165" y="55" width="70" height="50" rx="8" fill="#90cdf4"/>
  <!-- Eyes -->
  <circle cx="185" cy="78" r="8" fill="#1a365d"/>
  <circle cx="215" cy="78" r="8" fill="#1a365d"/>
  <circle cx="185" cy="76" r="3" fill="#fff"/>
  <circle cx="215" cy="76" r="3" fill="#fff"/>
  <!-- Antenna -->
  <line x1="200" y1="55" x2="200" y2="38" stroke="#90cdf4" stroke-width="3"/>
  <circle cx="200" cy="35" r="5" fill="#f6e05e"/>
  <!-- Arms -->
  <rect x="125" y="100" width="30" height="15" rx="5" fill="#63b3ed" opacity="0.8"/>
  <rect x="245" y="100" width="30" height="15" rx="5" fill="#63b3ed" opacity="0.8"/>
  <!-- Wheels -->
  <circle cx="175" cy="200" r="15" fill="#4a5568"/>
  <circle cx="225" cy="200" r="15" fill="#4a5568"/>
  <circle cx="175" cy="200" r="6" fill="#718096"/>
  <circle cx="225" cy="200" r="6" fill="#718096"/>
  <!-- Label -->
  <text x="200" y="255" text-anchor="middle" fill="#a0aec0" font-family="sans-serif" font-size="16" font-weight="600">Mobile Robotics</text>
</svg>