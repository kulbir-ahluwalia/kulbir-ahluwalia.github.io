<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300">
  <rect width="400" height="300" rx="8" fill="#1a202c"/>
  <rect x="20" y="20" width="360" height="260" rx="6" fill="#1c3d5a" opacity="0.5"/>
  <!-- Chat bubble -->
  <rect x="100" y="60" width="200" height="120" rx="15" fill="#2b6cb0" opacity="0.7"/>
  <polygon points="150,180 170,180 140,210" fill="#2b6cb0" opacity="0.7"/>
  <!-- Text lines in bubble -->
  <rect x="125" y="85" width="150" height="8" rx="4" fill="#63b3ed" opacity="0.6"/>
  <rect x="125" y="105" width="120" height="8" rx="4" fill="#63b3ed" opacity="0.5"/>
  <rect x="125" y="125" width="140" height="8" rx="4" fill="#63b3ed" opacity="0.4"/>
  <rect x="125" y="145" width="90" height="8" rx="4" fill="#63b3ed" opacity="0.3"/>
  <!-- Cursor blink -->
  <rect x="220" y="143" width="2" height="12" fill="#f6e05e" opacity="0.8"/>
  <!-- Label -->
  <text x="200" y="260" text-anchor="middle" fill="#a0aec0" font-family="sans-serif" font-size="16" font-weight="600">Natural Language Processing</text>
</svg>