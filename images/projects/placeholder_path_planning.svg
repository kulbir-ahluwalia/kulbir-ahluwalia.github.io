  <line x1="60" y1="50" x2="60" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="110" y1="50" x2="110" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="160" y1="50" x2="160" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="210" y1="50" x2="210" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="260" y1="50" x2="260" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="310" y1="50" x2="310" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="50" x2="340" y2="50" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="95" x2="340" y2="95" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <line x1="60" y1="140" x2="340" y2="140" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
