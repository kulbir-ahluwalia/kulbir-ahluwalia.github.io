  <line x1="60" y1="230" x2="340" y2="230" stroke="#2d3748" stroke-width="1" opacity="0.3"/>
  <!-- Obstacles -->
  <rect x="160" y="50" width="50" height="90" rx="4" fill="#e53e3e" opacity="0.3"/>
  <rect x="260" y="95" width="50" height="90" rx="4" fill="#e53e3e" opacity="0.3"/>
  <rect x="110" y="140" width="50" height="90" rx="4" fill="#e53e3e" opacity="0.3"/>
  <!-- Path -->
  <path d="M80,210 Q120,210 130,180 Q140,140 170,140 Q210,140 230,130 Q250,120 250,95 Q250,70 280,70 Q310,70 320,90" fill="none" stroke="#48bb78" stroke-width="3" stroke-dasharray="8,4"/>
  <!-- Start point -->
  <circle cx="80" cy="210" r="8" fill="#48bb78"/>
  <text x="80" y="214" text-anchor="middle" fill="#1a202c" font-family="sans-serif" font-size="10" font-weight="bold">S</text>
  <!-- End point -->
  <circle cx="320" cy="90" r="8" fill="#f6e05e"/>
  <text x="320" y="94" text-anchor="middle" fill="#1a202c" font-family="sans-serif" font-size="10" font-weight="bold">G</text>
  <!-- Label -->
  <text x="200" y="265" text-anchor="middle" fill="#a0aec0" font-family="sans-serif" font-size="16" font-weight="600">Path Planning</text>
