<svg xmlns="http://www.w3.org/2000/svg" width="320" height="320" viewBox="0 0 320 320">
  <rect width="320" height="320" rx="20" fill="#8E44AD"/>
  <!-- Simple robot body -->
  <rect x="120" y="90" width="80" height="55" rx="10" fill="none" stroke="white" stroke-width="3"/>
  <!-- Eyes -->
  <circle cx="145" cy="112" r="8" fill="white"/>
  <circle cx="175" cy="112" r="8" fill="white"/>
  <!-- Antenna -->
  <line x1="160" y1="90" x2="160" y2="72" stroke="white" stroke-width="3"/>
  <circle cx="160" cy="68" r="5" fill="white"/>
  <!-- Body -->
  <rect x="130" y="150" width="60" height="40" rx="5" fill="none" stroke="white" stroke-width="3"/>
  <!-- Cross (medical) -->
  <rect x="153" y="157" width="14" height="26" rx="2" fill="white"/>
  <rect x="147" y="163" width="26" height="14" rx="2" fill="white"/>
  <!-- Wheels -->
  <circle cx="138" cy="200" r="10" fill="none" stroke="white" stroke-width="3"/>
  <circle cx="182" cy="200" r="10" fill="none" stroke="white" stroke-width="3"/>
  <text x="160" y="245" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Arial, sans-serif" font-size="22">Autonomous</text>
  <text x="160" y="285" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Arial, sans-serif" font-size="16">Delivery Robot</text>
</svg>
